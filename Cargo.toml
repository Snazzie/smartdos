[package]
name = "smartdos"
version = "0.1.0"
edition = "2021"
description = "Ethical hacking wireless pentest tool — AP scanning, target management, and deauth attack orchestration"

[features]
demo = []

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
signal-hook = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
pcap = "2.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
